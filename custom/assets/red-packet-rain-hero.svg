    <text x="124" y="24" text-anchor="middle" fill="#b8ece5" font-family="Arial, sans-serif" font-size="13" font-weight="700">LIVE DROP</text>
    <text x="124" y="44" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="800">R$ 1,000 POOL</text>
  </g>
  <g transform="translate(208 148)" filter="url(#shadow)">
    <path d="M0 73L105 0l130 66-108 78z" fill="#f23648"/>
