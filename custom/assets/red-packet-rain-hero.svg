    <path d="M0 26h78" stroke="#ffb06a" stroke-width="4" opacity=".78"/>
    <circle cx="39" cy="26" r="12" fill="#ffdc71" stroke="#bd5732" stroke-width="3"/>
    <text x="39" y="32" text-anchor="middle" fill="#bd5732" font-family="Arial, sans-serif" font-size="13" font-weight="800">R$</text>
  </g>
  <g fill="url(#coin)" stroke="#a95f26" stroke-width="3" font-family="Arial, sans-serif" font-weight="800" text-anchor="middle">
    <ellipse cx="122" cy="290" rx="28" ry="13" transform="rotate(-26 122 290)"/><text x="122" y="297" font-size="17" transform="rotate(-26 122 290)">$</text>
    <ellipse cx="640" cy="280" rx="27" ry="13" transform="rotate(25 640 280)"/><text x="640" y="287" font-size="17" transform="rotate(25 640 280)">$</text>
    <ellipse cx="706" cy="228" rx="22" ry="11" transform="rotate(-16 706 228)"/><text x="706" y="234" font-size="14" transform="rotate(-16 706 228)">$</text>
    <ellipse cx="573" cy="321" rx="21" ry="10" transform="rotate(18 573 321)"/><text x="573" y="327" font-size="14" transform="rotate(18 573 321)">$</text>
