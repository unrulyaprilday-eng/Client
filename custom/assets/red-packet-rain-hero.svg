<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Red packet rain</title>
  <desc id="desc">A stage filled with red envelopes, coins, and a live reward panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27143f"/>
      <stop offset="0.5" stop-color="#762449"/>
      <stop offset="1" stop-color="#e2682e"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f89c4d"/>
      <stop offset="1" stop-color="#c43c38"/>
    </linearGradient>
    <linearGradient id="packet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff765d"/>
      <stop offset="1" stop-color="#c51f3c"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a1"/>
      <stop offset="0.45" stop-color="#ffc34d"/>
      <stop offset="1" stop-color="#e67824"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#190f2d" flood-opacity=".42"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <path d="M0 308C102 238 192 295 292 246S507 216 800 278V400H0Z" fill="#241038" opacity=".76"/>
  <path d="M0 330C122 288 223 354 352 299S602 280 800 314V400H0Z" fill="#0d192b" opacity=".44"/>
  <g fill="#ffdb79" opacity=".75">
    <circle cx="62" cy="58" r="3"/><circle cx="142" cy="118" r="2"/><circle cx="306" cy="52" r="3"/><circle cx="710" cy="60" r="3"/><circle cx="752" cy="174" r="2"/><circle cx="462" cy="76" r="2"/>
  </g>
  <g fill="none" stroke="#ffcc70" stroke-width="4" opacity=".38">
    <path d="M42 190C124 82 201 86 272 178"/>
    <path d="M553 34C644 118 712 113 785 206"/>
  </g>
  <g transform="translate(55 46)">
