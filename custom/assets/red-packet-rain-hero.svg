    <circle cx="37" cy="25" r="12" fill="#ffdc71" stroke="#bd5732" stroke-width="3"/>
    <text x="37" y="31" text-anchor="middle" fill="#bd5732" font-family="Arial, sans-serif" font-size="13" font-weight="800">R$</text>
  </g>
